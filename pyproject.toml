[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill_self_evolution"
version = "0.3.4"
description = "Skill 自进化框架：Pydantic 全链路校验 + 规则执行 + AI 常识判断 + 离线进化 + AI 生成代码质量门禁的 Skill 执行引擎"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "httpx>=0.28",
    "pymysql>=1.1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
lint = [
    "ryl>=0.10",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["skill_self_evolution"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests that require external resources (AI API, DB, etc.)",
]
